version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - SECRET_KEY=prod-secret-2026-key-change-me
      - JWT_SECRET_KEY=jwt-prod-super-secret-key-change-me
      - DATABASE_URL=sqlite:////app/backend/resume_app.db
      - GEMINI_API_KEY=
    volumes:
      - sqlite_data:/app/backend

volumes:
  sqlite_data:
